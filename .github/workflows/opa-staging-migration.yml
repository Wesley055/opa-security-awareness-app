name: OPA staging migration
run-name: OPA staging ${{ inputs.mode }} ${{ inputs.runner_lease }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Auth-only first; migration requires separate approval
        type: choice
        options: [auth-only, migrate]
        default: auth-only
        required: true
      approved_sha:
        description: Exact reviewed commit SHA on integration/institutional-security
        type: string
        required: true
      runner_lease:
        description: Lease ID generated by the operator-host launcher
        type: string
        required: true
      migration_confirmation:
        description: Leave empty for auth-only; migration requires MIGRATE_OPA_STAGING
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: opa-staging-migration
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'Wesley055/opa-security-awareness-app' && github.ref == 'refs/heads/integration/institutional-security'
    environment: staging
    runs-on: [self-hosted, Linux, X64, opa-staging-ephemeral]
    timeout-minutes: 30
    env:
      OPA_RUNNER_LEASE: ${{ inputs.runner_lease }}
      OPA_APPROVED_SHA: ${{ inputs.approved_sha }}
      OPA_STAGING_MODE: ${{ inputs.mode }}
      OPA_MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
    steps:
      - name: Check out reviewed staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Verify runner and immutable invocation
        run: node -e "const g=require('./apps/api/scripts/staging-oidc.cjs');g.execution(process.env);g.runnerLease(process.env)"
      - name: Use reviewed npm version
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build API preflight tooling
        run: npm --workspace apps/api run build
      - name: Test staging invocation boundaries
        run: node --test apps/api/scripts/staging-oidc.test.cjs packages/environment-policy/policy.test.cjs
      - name: Authenticate and validate staging; migrate only when explicitly selected
        env:
          OPA_STAGING_MIGRATION_POLICY: ${{ vars.OPA_STAGING_MIGRATION_POLICY }}
        run: node apps/api/scripts/staging-oidc.cjs
      - name: Signal operator-host cleanup
        if: always()
        run: |
          node -e "const fs=require('node:fs'),p=require('node:path');fs.writeFileSync(p.join(process.env.RUNNER_TEMP,'opa-staging-job-finished.json'),JSON.stringify({runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA,cleanupOwner:'operator-host'}));console.log('Job finished; operator-host lease cleanup required')"